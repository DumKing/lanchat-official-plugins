<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大富翁</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header class="top"><div><small>官方插件</small><h1>大富翁 · 午休娱乐局</h1></div><div class="top-actions"><div class="segmented"><button id="flatView">平面</button><button id="threeView" class="active">3D</button></div><button id="inviteButton" class="ghost">邀请</button><button id="rulesButton" class="ghost">玩法规则</button><button id="leaveButton" class="danger">离开房间</button></div></header><section class="workspace"><aside class="rooms-panel"><div class="panel-title"><strong>游戏房间</strong><button id="refreshRooms" class="tiny ghost">刷新</button></div><div class="create"><input id="roomName" value="大富翁房间"><button id="createRoom">创建</button></div><button id="addBotButton" class="ghost wide">添加机器人</button><div id="roomList" class="room-list">正在读取房间…</div><div id="players" class="player-list"></div></aside><section class="board-panel"><div class="zoom"><button id="zoomOut" class="ghost">−</button><output id="zoomValue">100%</output><button id="zoomIn" class="ghost">＋</button><button id="resetZoom" class="ghost">复位</button></div><div id="boardStage" class="board-stage view-3d"><div id="board" class="board"></div><div class="center"><div id="banner" class="banner">等待玩家加入</div><div id="turnInfo" class="turn-info">第 1 / 20 回合</div><div id="currentPlayer" class="current-player">尚未开始</div><div id="cards" class="cards"></div><div class="actions"><button id="readyButton">准备</button><button id="startButton">开始游戏</button><button id="rollButton">投骰子</button><button id="buyButton">购买</button><button id="skipButton" class="ghost">跳过</button><button id="restartButton">再来一局</button></div></div></div><div class="bottom-grid"><section class="event-log"><strong>事件日志</strong><div id="logs"></div></section><section class="room-chat"><strong>房间聊天</strong><div id="chatList" class="chat-list"></div><div class="chat-compose"><input id="chatInput" placeholder="输入消息…"><button id="sendChat">发送</button></div></section></div></section></section></main><dialog id="rules"><button id="closeRules" class="close">×</button><h2>大富翁玩法规则</h2><div class="rules-grid"><article><div class="rule-image corner start"></div><strong>起点</strong><p>经过起点领取 1000 金币。</p></article><article><div class="rule-image corner airport"></div><strong>飞机场</strong><p>选择任意地块直接传送。</p></article><article><div class="rule-image corner double"></div><strong>地价翻倍</strong><p>随机地产提高到 ×2、×3。</p></article><article><div class="rule-image corner jail"></div><strong>监狱</strong><p>停留三个自己的回合。</p></article><article><img src="./assets/events/slot-machine.png"><strong>随机事件</strong><p>触发补贴、维护、道具或神明。</p></article><article><div class="rule-image item wealth"></div><strong>财神</strong><p>附身时免交过路费。</p></article><article><div class="rule-image item poverty"></div><strong>穷鬼</strong><p>附身时过路费翻倍。</p></article><article><div class="rule-image item angel"></div><strong>天使</strong><p>附身地块建筑自动升级。</p></article><article><div class="rule-image item devil"></div><strong>恶魔</strong><p>附身地块建筑自动降级。</p></article></div></dialog><script type="module" src="./main.js"></script></body></html>
