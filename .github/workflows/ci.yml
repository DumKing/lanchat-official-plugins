name: CI

on:
  push:
    branches: [main, codex/plugin-platform-v080]
  pull_request:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  monopoly-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout LanChat migration history
        uses: actions/checkout@v4
        with:
          repository: DumKing/lanchat
          path: .ci/lanchat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test Monopoly migration guard
        env:
          LANCHAT_MAIN_REPO: ${{ github.workspace }}/.ci/lanchat
        run: npm test --workspace @dumking/lanchat-plugin-monopoly

  plugin-package:
    runs-on: ubuntu-latest
    needs: layout
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: com.lanchat.gomoku
            workspace: '@dumking/lanchat-plugin-gomoku'
          - id: com.lanchat.xiangqi
            workspace: '@dumking/lanchat-plugin-xiangqi'
          - id: com.lanchat.minesweeper
            workspace: '@dumking/lanchat-plugin-minesweeper'
          - id: com.lanchat.monopoly
            workspace: '@dumking/lanchat-plugin-monopoly'
          - id: com.lanchat.doudizhu
            workspace: '@dumking/lanchat-plugin-doudizhu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace ${{ matrix.workspace }}
      - name: Build development package
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: npm run plugin:package -- plugins/${{ matrix.id }} artifacts --development
      - name: Build signed release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LANCHAT_PLUGIN_KEY_ID: ${{ secrets.LANCHAT_PLUGIN_KEY_ID }}
          LANCHAT_PLUGIN_PRIVATE_KEY: ${{ secrets.LANCHAT_PLUGIN_PRIVATE_KEY }}
        run: npm run plugin:package -- plugins/${{ matrix.id }} artifacts
      - name: Write checksum
        shell: bash
        run: sha256sum artifacts/*.lcp > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-${{ github.sha }}
          path: |
            artifacts/*.lcp
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
